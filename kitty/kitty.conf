# kitty — the terminal. Ported from alacritty/alacritty.toml (same font, padding,
# opacity, palette); alacritty stays installed as the xdg-terminals.list fallback.
# kitty's graphics protocol is what gives yazi real image / video / PDF previews.

font_family      CaskaydiaMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        9.0

window_padding_width     14
background_opacity       0.9
hide_window_decorations  yes
confirm_os_window_close  0
enable_audio_bell        no
cursor_blink_interval    0
shell                    /usr/bin/fish
allow_remote_control     no
copy_on_select           no
# like alacritty's osc52 = "CopyPaste": programs may write the clipboard (nvim, yazi...)
clipboard_control        write-clipboard write-primary read-clipboard-ask read-primary-ask
# alacritty set TERM=xterm-256color; keeps ssh to hosts without the kitty terminfo working
term                     xterm-256color
# fish + starship + atuin are configured by us; no injected shell integration
shell_integration        disabled

# --- keys (same as alacritty) ---
# Shift+Enter sends Escape+Return: a newline in apps that use it (Claude Code)
map shift+enter       send_text all \x1b\r
map ctrl+insert       copy_to_clipboard
map shift+insert      paste_from_clipboard
map f11               toggle_fullscreen
# kitty's own: ctrl+shift+c / v copy / paste · ctrl+shift+e open a URL by hint ·
# ctrl+shift+h scrollback in a pager · ctrl+shift+= / - font size

# --- stone palette (alacritty/theme.toml) ---
foreground              #fafaf9
background              #0c0a09
selection_foreground    #fafaf9
selection_background    #44403c
cursor                  #fafaf9
cursor_text_color       #0c0a09
url_color               #d6d3d1

color0  #3b4261
color1  #ff5d7a
color2  #9fef57
color3  #f7be50
