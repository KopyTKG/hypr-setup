# Dmenu-style picker: pipe newline-delimited items, get selection on stdout.
#
#   printf '%s\n' a b c | spot ~/.config/spot/menu.toml
#
# Caller can override placeholder via SPOT_PLACEHOLDER env (read in a wrapper)
# — for now placeholder is generic.

anchor   = "center"
width    = 320
style    = "spot.css"
keyboard = "exclusive"

# No fade: arch-menu opens a fresh spot per category, and the fade restarting on
# each one shows up as a transparency blink.
[opacity]
outside = 100

[[items]]
type        = "list"
id          = "choice"
placeholder = "Search…"
match       = "smart"   # abbreviations: "rmt" -> Remote, "sf" -> System Firewall (needs spot >= 0.2.2, ignored by older)
stdin       = true
height      = 480

[submit]
stdout = "{choice}"
