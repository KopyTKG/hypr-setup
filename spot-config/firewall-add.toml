# Add a firewall rule (arch-firewall → "Add rule…"). JSON out:
#   {"action":"allow","direction":"in","proto":"tcp","port":"22","from":""}
# arch-firewall turns it into:  ufw <action> <direction> [proto P] [from F] to any port <port>

title    = "Add rule"
anchor   = "center"
width    = 460
style    = "spot.css"
keyboard = "exclusive"

[[items]]
type    = "select"
id      = "action"
label   = "Action"
options = ["allow", "deny", "limit", "reject"]
default = "allow"

[[items]]
type    = "select"
id      = "direction"
label   = "Direction"
options = ["in", "out"]
default = "in"

[[items]]
type    = "select"
id      = "proto"
label   = "Protocol"
options = ["tcp", "udp", "any"]
default = "tcp"

[[items]]
type        = "field"
id          = "port"
label       = "Port  (22 · 8000:8100 · 80,443)"
placeholder = "22"
required    = true
pattern     = '^[0-9]+([:,][0-9]+)*$'
error       = "A port, a range (8000:8100) or a list (80,443)"

[[items]]
type        = "field"
id          = "from"
label       = "From  (optional)"
placeholder = "Anywhere"
pattern     = '^[0-9a-fA-F:.]+(/[0-9]{1,3})?$'
error       = "An address or network, e.g. 192.168.1.0/24"

[submit]
format = "json"
