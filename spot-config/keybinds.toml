# Keybinds — every keybind in the setup (arch-keybinds, SUPER+F1, Menu → Keybinds),
# as a COLLAPSIBLE list: one folded group per scope (Hyprland · Apps, Yazi, fish,
# kitty, nvim, mpv, waybar clicks, ...). Enter, click or Left/Right on a group header
# folds / unfolds it; typing searches every group at once, folded or not, and the group
# name counts as part of the row: "yazi seek", "fish ctrl r", "nvim lsp". You can also
# search by the key combination itself, typed any way: "super+3", "super 3", "ctrl+shift+c"
# (the dialog shows keys as SUPER+3 so that all of those match).
# Needs spot >= 0.5.0 (collapsible lists). Enter on a row just closes the dialog.
#
# The list's label is the column header. It must equal `arch-keybinds header` (it is
# indented like the rows of a group); the table is monospace (spot.css sets the family).
# SPOT_TITLE (the count) is supplied by the script.

anchor   = "center"
width    = 1180
style    = "spot.css"
keyboard = "exclusive"
toggle   = true        # a keybind dialog: pressing the key again closes it, repeats never queue up

[opacity]
outside = 100

[[items]]
type        = "list"
id          = "row"
collapsible = true
collapsed   = true     # start with every group folded: a short index, open what you need
label       = "     KEYS                             WHAT IT DOES"
placeholder = "Filter…  super+3 · ctrl+shift+c · alt+tab · yazi seek · nvim lsp"
match       = "smart"
stdin       = true
height      = 640

[submit]
stdout = "{row}"
