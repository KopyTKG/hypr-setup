# App launcher (arch-launch-apps, SUPER+SPACE, Menu → Apps): spot's `apps` item
# Type to search the installed applications (name first, then
# comment / keywords / id; abbreviations work: "ff" finds Firefox), Enter launches.
# A prefix hands the search to a command instead (the [[sources]] at the bottom):
#   = 2+2        calculator (qalc); Enter copies the result      ("5 ft to cm")
#   . report     files and folders under ~ (fd); Enter opens them
#   @ gtk4       web search, one row per engine (arch-menu/websearch.conf)
#   > htop       run a command ("> fire" completes from PATH); a terminal program such as
#                htop is rerun in a terminal automatically; ">> htop" forces a terminal
# The most-launched apps come first. Needs spot >= 0.5.0.
#
# How apps start is [apps.launch]: through uwsm-app like every other launcher in
# this setup, terminal apps wrapped in xdg-terminal-exec. Webapps from the arch
# menu (~/.local/share/applications/*.desktop) show up on their own; spot rescans
# when that folder changes, no signal needed.

title    = ""
anchor   = "center"
width    = 720
style    = "spot.css"
keyboard = "exclusive"
toggle   = true        # a keybind dialog: pressing the key again closes it, repeats never queue up (spot >= 0.5.0)

[opacity]
outside = 100

[back]
show = "never"           # the launcher is a top-level thing: never offer Back

[[items]]
type        = "apps"
id          = "app"
placeholder = "Search apps…   = calc · . files · @ web · > run"
height      = 420

[apps]
icon_size          = 32      # icons of the other rows
icon_size_selected = 48      # the selected row's icon (its text size is in spot.css)
show_comment = true
max_results  = 0
frecency     = true
# exclude    = ["*Setup*", "avahi-*"]    # hide by desktop id or name

[apps.launch]
command  = "uwsm-app -- {exec}"
terminal = "xdg-terminal-exec {exec}"

[[sources]]
name     = "calc"
prefix   = "="
icon     = "accessories-calculator"
exec     = "arch-launcher-calc {query}"
activate = "wl-copy {value}"

[[sources]]
name     = "files"
prefix   = "."
icon     = "system-file-manager"
exec     = "arch-launcher-files {query}"
activate = "xdg-open {value}"

[[sources]]
name     = "web"
prefix   = "@"
icon     = "web-browser"
exec     = "arch-launcher-web {query}"
activate = "xdg-open {value}"

[[sources]]
name     = "run"
prefix   = ">"
icon     = "utilities-terminal"
exec     = "arch-launcher-run {query}"
activate = "arch-run-command {value}"      # runs it; a terminal program that fails at once is rerun in a terminal

[[sources]]
name     = "run in terminal"
prefix   = ">>"
icon     = "utilities-terminal"
exec     = "arch-launcher-run {query}"
activate = "uwsm-app -- xdg-terminal-exec sh -c {value}"
