# Single-field password prompt. Prints the password on stdout on Enter,
# exits 1 on Esc. The wrapper passes a placeholder via TOML rewrite or
# sets SPOT_PROMPT in env — for now the title/footer are static.
#
#   pw=$(spot ~/.config/spot/password.toml) || exit 1

title    = "Password"
anchor   = "center"
width    = 420
style    = "spot.css"
footer   = "Enter to submit · Esc to cancel"
keyboard = "exclusive"

[[items]]
type  = "password"
id    = "pw"
label = "Password"

[submit]
stdout = "{pw}"
