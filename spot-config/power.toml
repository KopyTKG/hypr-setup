# Power menu — two-section tile picker: session/machine power actions, battery (profile + monitor).
#
#   spot ~/.config/spot/power.toml

title    = "Power Menu"
anchor   = "center"
width    = 480
style    = "spot.css"
keyboard = "exclusive"

# Fade the menu itself while the pointer is outside it.
[opacity]
inside     = 100
outside    = 85
transition = 150

[[items]]
label   = "Power"
type    = "tiles"
id      = "action"
columns = 3

[[items.tiles]]
icon  = ""
label = "Lock"
value = "lock"

[[items.tiles]]
icon  = ""
label = "Suspend"
value = "suspend"

[[items.tiles]]
icon  = ""
label = "Hibernate"
value = "hibernate"

[[items.tiles]]
icon  = ""
label = "Logout"
value = "logout"

[[items.tiles]]
icon  = ""
label = "Restart"
value = "restart"

[[items.tiles]]
icon  = ""
label = "Shutdown"
value = "shutdown"

[[items]]
label   = "Battery"
type    = "tiles"
id      = "battery"
columns = 4
default = "balanced"

[[items.tiles]]
icon  = ""
label = "Power saver"
value = "power-saver"

[[items.tiles]]
icon  = ""
label = "Balanced"
value = "balanced"

[[items.tiles]]
icon  = ""
label = "Performance"
value = "performance"

[[items.tiles]]
icon  = ""
label = "Monitor"
value = "jolt"

[submit]
# {_active} = id of the tile group last interacted with (needs spot with _active support)
stdout = "{_active} {action} {battery}"
