# Power menu — two-section tile picker: session/machine power actions, battery (power profile).
#
#   spot ~/.config/spot/power.toml

title    = "Power Menu"
anchor   = "center"
width    = 480
style    = "spot.css"
keyboard = "exclusive"
toggle   = true        # a keybind dialog: pressing the key again closes it, repeats never queue up (spot >= 0.5.0)

# Two sections so the rows can have different widths: Lock / Suspend share the top row
# 50/50, the other three sit below. No label on the second, so they read as one block.
[[items]]
label   = "Power"
type    = "tiles"
id      = "session"
columns = 2

[[items.tiles]]
icon  = ""
label = "Lock"
value = "lock"

[[items.tiles]]
icon  = ""
label = "Suspend"
value = "suspend"

[[items]]
type    = "tiles"
id      = "action"
columns = 3

[[items.tiles]]
icon  = ""
label = "Logout"
value = "logout"

[[items.tiles]]
icon  = ""
label = "Restart"
value = "restart"

[[items.tiles]]
icon  = ""
label = "Shutdown"
value = "shutdown"

[[items]]
label   = "Battery"
type    = "tiles"
id      = "battery"
columns = 3
default = "balanced"   # fallback; arch-power-menu sets SPOT_DEFAULT_BATTERY to the active profile

[[items.tiles]]
icon  = ""
label = "Power saver"
value = "power-saver"

[[items.tiles]]
icon  = ""
label = "Balanced"
value = "balanced"

[[items.tiles]]
icon  = ""
label = "Performance"
value = "performance"

[submit]
# One JSON object: {"_active":"battery","session":"lock","action":"logout","battery":"balanced"}.
# _active = id of the tile section last used. arch-power-menu parses it with jq.
format = "json"
