# Power menu — two-section tile picker: session/machine power actions, battery (power profile).
#
#   spot ~/.config/spot/power.toml

title    = "Power Menu"
anchor   = "center"
width    = 480
style    = "spot.css"
keyboard = "exclusive"

[[items]]
label   = "Power"
type    = "tiles"
id      = "action"
columns = 3

[[items.tiles]]
icon  = ""
label = "Lock"
value = "lock"

[[items.tiles]]
icon  = ""
label = "Suspend"
value = "suspend"

[[items.tiles]]
icon  = ""
label = "Hibernate"
value = "hibernate"

[[items.tiles]]
icon  = ""
label = "Logout"
value = "logout"

[[items.tiles]]
icon  = ""
label = "Restart"
value = "restart"

[[items.tiles]]
icon  = ""
label = "Shutdown"
value = "shutdown"

[[items]]
label   = "Battery"
type    = "tiles"
id      = "battery"
columns = 3
default = "balanced"   # fallback; arch-power-menu sets SPOT_DEFAULT_BATTERY to the active profile

[[items.tiles]]
icon  = ""
label = "Power saver"
value = "power-saver"

[[items.tiles]]
icon  = ""
label = "Balanced"
value = "balanced"

[[items.tiles]]
icon  = ""
label = "Performance"
value = "performance"

[submit]
# One JSON object: {"_active":"battery","action":"lock","battery":"balanced"}.
# _active = id of the tile section last used. arch-power-menu parses it with jq.
format = "json"
