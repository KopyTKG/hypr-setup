[preferred]
default=hyprland;gtk
# Open/save dialogs: yazi in a floating terminal (xdg-desktop-portal-termfilechooser)
org.freedesktop.impl.portal.FileChooser=termfilechooser
# Passwords / tokens for flatpak apps (Nextcloud Passwords, ...): the Secret portal
# is answered by gnome-keyring. Its portal file says UseIn=gnome, so on Hyprland
# nothing would pick it without this line (libsecret then fails with ServiceUnknown).
org.freedesktop.impl.portal.Secret=gnome-keyring
