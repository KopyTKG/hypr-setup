# Service templates for arch-firewall → "Add rule…". Pick one and it adds all of
# its rules (from anywhere, or only from your local network).
#
# Format:  Name | rules | note
#   rules  = one or more "ACTION DIRECTION PROTO PORT", separated by ;
#            ACTION allow|deny|limit|reject · DIRECTION in|out · PROTO tcp|udp|any
#            PORT 22 · 8000:8100 (range) · 80,443 (list). Ranges and lists need
#            tcp or udp, not "any" (ufw rule); "any" covers both tcp and udp.
#   Lines starting with # are comments. Edit freely; re-read on every open.

SSH              | allow in tcp 22                                  | remote login
HTTP + HTTPS     | allow in tcp 80; allow in tcp 443                | serve a website
FTP server       | allow in tcp 21; allow in tcp 40000:40100        | serve FTP; passive ports 40000-40100 (match them in the server)
DNS server       | allow in any 53                                  | only if this machine answers DNS (clients don't need it)
DHCP client      | allow in udp 68                                  | ufw already allows the reply; for strict setups
DHCP server      | allow in udp 67                                  | hand out addresses
LocalSend        | allow in any 53317                               | file sharing over the LAN
KDE Connect      | allow in tcp 1714:1764; allow in udp 1714:1764   | phone link (also GSConnect)
mDNS / Avahi     | allow in udp 5353                                | discovery: printers, Chromecast, AirPlay
Samba / SMB      | allow in tcp 139; allow in tcp 445; allow in udp 137:138 | Windows file shares
Syncthing        | allow in tcp 22000; allow in udp 22000; allow in udp 21027 | file sync
Spotify devices  | allow in any 57621                               | local discovery of Spotify Connect devices
WireGuard        | allow in udp 51820                               | VPN server
Minecraft        | allow in tcp 25565                               | game server
Dev: Vite / Next | allow in tcp 3000; allow in tcp 5173; allow in tcp 8080 | reach dev servers from the phone
Dev: Expo        | allow in tcp 8081; allow in tcp 19000:19002      | Metro bundler, Expo Go on a phone
