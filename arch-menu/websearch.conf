# Web search engines for the launcher's "@" prefix (bin/arch-launcher-web).
# Format:  Name | URL, with %s where the (URL-encoded) query goes. One row each,
# in this order. Lines starting with # are comments. Edit freely.

DuckDuckGo     | https://duckduckgo.com/?q=%s
Google         | https://www.google.com/search?q=%s
Arch Wiki      | https://wiki.archlinux.org/index.php?search=%s
AUR            | https://aur.archlinux.org/packages?K=%s
Wikipedia      | https://en.wikipedia.org/w/index.php?search=%s
GitHub         | https://github.com/search?q=%s
YouTube        | https://www.youtube.com/results?search_query=%s
Google Maps    | https://www.google.com/maps/search/%s
