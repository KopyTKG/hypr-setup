zathura | SHIFT + J / K  | Next / previous page
zathura | SPACE          | Scroll down a page
zathura | CTRL + D / U   | Half page down / up
zathura | G / g g        | Last / first page
zathura | + / -          | Zoom in / out
zathura | a              | Fit the page to the window
zathura | s              | Fit the page width
zathura | d              | Toggle the two-page view
