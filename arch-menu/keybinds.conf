# Keybinds that are NOT Hyprland binds — read by bin/arch-keybinds (SUPER+F1 and
# `arch-keybinds --md`, which writes KEYBINDS.md).
#
# Hyprland binds come live from `hyprctl binds`, and the waybar clicks are read
# from waybar/modules.jsonc, so neither is listed here. This file is for the rest.
#
# Format:  Scope | Keys | What it does
#   - Scopes are shown in the order they first appear in this file.
#   - Write combos as  CTRL + SHIFT + C  (spaces around the plus); the viewer
#     colours the modifiers. Anything else (TAB, F1, "type", "!!") is shown as is.
#   - Lines starting with # are comments. Blank lines are ignored.
# Edit freely; arch-keybinds re-reads this file on each run.

# --- Dialogs & menus (spot: arch-menu, power, firewall, sockets, ...) --------
Dialogs & menus | type             | Filter the list; every word has to match ("tcp listen 22", "rmt" finds Remote)
Dialogs & menus | ENTER            | Pick the highlighted row or tile / submit the form
Dialogs & menus | ESC              | Cancel and close
Dialogs & menus | CLICK OUTSIDE    | Close the dialog (same as Esc)
Dialogs & menus | UP / DOWN        | Move through a list
Dialogs & menus | PAGE UP / DOWN   | Move ten rows in a list
Dialogs & menus | ARROWS           | Move the cursor across tiles
Dialogs & menus | SPACE            | Toggle a row in a multi-select list (SHIFT / CTRL + arrows select ranges)
Dialogs & menus | TAB              | Move between the fields of a form
Dialogs & menus | CTRL + ENTER     | Submit from a multi-line text box (plain Enter is a newline)
Dialogs & menus | BACKSPACE        | Back, on tiles, a list or an empty search (only when the dialog has a Back button)
Dialogs & menus | ALT + LEFT       | Back, from anywhere in the dialog (only when it has a Back button)

# --- Shell (fish) ------------------------------------------------------------
Shell (fish) | TAB                | fzf over completions; on `cd` and on any `**` token it searches recursively
Shell (fish) | SHIFT + TAB        | fzf's own completer (also expands `**`)
Shell (fish) | CTRL + R           | Search history with atuin (directory, exit code and time per command)
Shell (fish) | CTRL + T           | Pick files with fzf and insert the paths
Shell (fish) | ALT + C            | Pick a directory with fzf and cd into it
Shell (fish) | ALT + S            | Put sudo at the start of the command (again to remove it)
Shell (fish) | ALT + SHIFT + S    | Pick an SSH host with fzf and connect (fssh)
Shell (fish) | !!                 | Expands to the last command, e.g. `sudo !!`
Shell (fish) | !$                 | Expands to the last argument of the last command
Shell (fish) | RIGHT / CTRL + F   | Accept the grey autosuggestion
Shell (fish) | ALT + RIGHT        | Accept one word of the autosuggestion

# --- Terminal (kitty) --------------------------------------------------------
Terminal (kitty) | F11               | Toggle fullscreen
Terminal (kitty) | CTRL + SHIFT + C  | Copy
Terminal (kitty) | CTRL + SHIFT + V  | Paste
Terminal (kitty) | CTRL + INSERT     | Copy
Terminal (kitty) | SHIFT + INSERT    | Paste
Terminal (kitty) | SHIFT + RETURN    | Send Escape + Return: a newline in apps that use it (Claude Code)
Terminal (kitty) | CTRL + SHIFT + E  | Open a URL in the output by hint letters
Terminal (kitty) | CTRL + SHIFT + H  | Scrollback in a pager (search with /)
Terminal (kitty) | CTRL + SHIFT + = / - | Bigger / smaller font

# --- Editor (nvim) -----------------------------------------------------------
Editor (nvim) | F1 | Help popup that lists every nvim keybind (q or Esc closes it)

# --- Keyboard ----------------------------------------------------------------
Keyboard | CAPS LOCK | Compose key (type accented and special characters); layouts us / cz are switched from the waybar indicator

# --- Waybar (clicks that are not in modules.jsonc) ---------------------------
Waybar | CLICK | Workspace buttons: switch to that workspace

# --- Terminal UIs ------------------------------------------------------------
Terminal UIs | A / D / L        | arch-firewall-tui: allow / deny / limit a port
Terminal UIs | X                | arch-firewall-tui: delete the selected rule
Terminal UIs | E                | arch-firewall-tui: enable / disable the firewall
Terminal UIs | SHIFT + R / R    | arch-firewall-tui: reset all rules / refresh
Terminal UIs | ? / Q            | arch-firewall-tui: details / quit
Terminal UIs | TAB              | fzf pickers (install / remove): mark several, ENTER confirms
Terminal UIs | SPACE            | gum menus: toggle an entry in a multi-select, ENTER confirms
Terminal UIs | D                | gdu (System → Disk): delete the selected file or folder

# --- Apps whose keys cannot be read from the app itself (shown only when installed) -------
# lazygit
lazygit | ?              | Show every keybinding of the current panel
lazygit | 1 - 5          | Jump to the Status / Files / Branches / Commits / Stash panel
lazygit | SPACE          | Stage / unstage the selected file
lazygit | a              | Stage / unstage all files
lazygit | c              | Commit staged changes
lazygit | SHIFT + A      | Amend the last commit
lazygit | SHIFT + P      | Push
lazygit | p              | Pull
lazygit | d              | Discard changes of the selected file / delete the selected branch
lazygit | s              | Stash changes
lazygit | z              | Undo
lazygit | e              | Edit the selected file
lazygit | /              | Filter the list
lazygit | q              | Quit

# lazydocker
lazydocker | x           | Show the keybinding menu
lazydocker | [ / ]       | Previous / next tab of the panel
lazydocker | ENTER       | Focus the main panel
lazydocker | d           | Remove the selected container / image / volume
lazydocker | s           | Stop the selected container
lazydocker | r           | Restart the selected container
lazydocker | a           | Attach to the selected container
lazydocker | q           | Quit

# btop
