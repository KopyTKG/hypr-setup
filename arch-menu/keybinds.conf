zathura | TAB            | Table of contents
zathura | F5             | Presentation mode
zathura | F11            | Fullscreen
zathura | SHIFT + R      | Reload the document
zathura | q              | Quit

# gdu
gdu | ?                  | Help
gdu | d                  | Delete the selected file or folder
gdu | n / s / SHIFT + C  | Sort by name / size / item count
gdu | a                  | Toggle apparent size and disk usage
gdu | c                  | Show item counts
gdu | i                  | Information about the selected item
gdu | r                  | Rescan
gdu | /                  | Search
gdu | b                  | Open a shell here
gdu | q                  | Quit
