btop | ESC / m           | Menu
btop | o                 | Options
btop | 1 2 3 4          | Toggle the cpu / memory / network / process boxes
btop | p / SHIFT + P    | Next / previous preset layout
btop | f                 | Filter processes
btop | e                 | Process tree view
btop | k                 | Kill the selected process
btop | s                 | Send a signal to the selected process
btop | t                 | Terminate the selected process
btop | r                 | Reverse the process sort order
btop | LEFT / RIGHT     | Change the process sort column
btop | q                 | Quit

