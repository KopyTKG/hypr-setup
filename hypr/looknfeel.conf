# Custom look'n'feel overrides

general {
    # 1px borders, matching the waybar pill style
    border_size = 1
    col.active_border   = rgba(f5f5f480)   # stone-100 @ 50%
    col.inactive_border = rgba(f5f5f433)   # stone-100 @ 20%
}

decoration {
    # Small, smoothly rounded corners (squircle — higher rounding_power = smoother curve)
    rounding = 8
    rounding_power = 6

    # Unfocused windows fade slightly toward the wallpaper — same translucent feel as waybar pills
    active_opacity   = 1.0
    inactive_opacity = 0.85

    # Plus a uniform dim so unfocused windows visibly recede
    dim_inactive = true
    dim_strength = 0.2
}
