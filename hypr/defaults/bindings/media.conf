# Laptop multimedia keys for volume and LCD brightness (with OSD)
bindeld = ,XF86AudioRaiseVolume, Volume up, exec, swayosd-client --output-volume raise
bindeld = ,XF86AudioLowerVolume, Volume down, exec, swayosd-client --output-volume lower
bindeld = ,XF86AudioMute, Mute, exec, swayosd-client --output-volume mute-toggle
bindeld = ,XF86AudioMicMute, Mute microphone, exec, swayosd-client --input-volume mute-toggle
bindeld = ,XF86MonBrightnessUp, Brightness up, exec, swayosd-client --brightness raise
bindeld = ,XF86MonBrightnessDown, Brightness down, exec, swayosd-client --brightness lower
bindeld = SHIFT, XF86MonBrightnessUp, Brightness maximum, exec, swayosd-client --brightness 100
bindeld = SHIFT, XF86MonBrightnessDown, Brightness minimum, exec, swayosd-client --brightness 1
bindeld = ,XF86KbdBrightnessUp, Keyboard brightness up, exec, arch-brightness-keyboard up
bindeld = ,XF86KbdBrightnessDown, Keyboard brightness down, exec, arch-brightness-keyboard down
bindld = ,XF86KbdLightOnOff, Keyboard backlight cycle, exec, arch-brightness-keyboard cycle
bindld = ,XF86TouchpadToggle, Toggle touchpad, exec, arch-toggle-touchpad
bindld = ,XF86TouchpadOn, Enable touchpad, exec, arch-toggle-touchpad on
bindld = ,XF86TouchpadOff, Disable touchpad, exec, arch-toggle-touchpad off

# Precise 1% multimedia adjustments with Alt modifier
bindeld = ALT, XF86AudioRaiseVolume, Volume up precise, exec, swayosd-client --output-volume +1
bindeld = ALT, XF86AudioLowerVolume, Volume down precise, exec, swayosd-client --output-volume -1
bindeld = ALT, XF86MonBrightnessUp, Brightness up precise, exec, swayosd-client --brightness +1
bindeld = ALT, XF86MonBrightnessDown, Brightness down precise, exec, swayosd-client --brightness -1

# Media controls via playerctl
bindld = , XF86AudioNext, Next track, exec, playerctl next
bindld = , XF86AudioPause, Pause, exec, playerctl play-pause
bindld = , XF86AudioPlay, Play, exec, playerctl play-pause
bindld = , XF86AudioPrev, Previous track, exec, playerctl previous

# Switch audio output with Super + Mute
bindld = SUPER, XF86AudioMute, Switch audio output, exec, arch-audio-output-switch
