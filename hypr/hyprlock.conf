source = ~/.config/hypr/theme/hyprlock.conf
 
general {
    ignore_empty_input = true
}

background {
    monitor =
    color = $color
    path = ~/.config/hypr/theme/background.jpg
    blur_passes = 3
}

animations {
    enabled = false
}

# Time — top-right, matches SDDM stone theme.
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $font_color
    font_family = CaskaydiaMono Nerd Font
    font_size = 48
    halign = right
    valign = top
    position = -40, -40
}

# Date — under the clock, muted.
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %-d')"
    color = $check_color
    font_family = CaskaydiaMono Nerd Font
    font_size = 16
    halign = right
    valign = top
    position = -40, -110
}

input-field {
    monitor =
    size = 650, 100
    position = 0, 0
    halign = center
    valign = center

    inner_color = $inner_color
    outer_color = $outer_color
    outline_thickness = 1

    font_family = CaskaydiaMono Nerd Font
    font_color = $font_color

    placeholder_text = Enter Password
    check_color = $check_color
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 16
    shadow_passes = 0
    fade_on_empty = false
}

auth {
    fingerprint:enabled = false
}
