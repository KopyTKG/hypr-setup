# Custom window rules

# All arch-* alacritty windows (installers + TUI control panels) float centered
windowrule = float on,        match:class arch-.*
windowrule = center on,       match:class arch-.*
windowrule = size 1400 900,   match:class arch-.*

# Walker (as_window=true in walker/config.toml) — float + center
windowrule = float on,        match:class dev\.benz\.walker
windowrule = center on,       match:class dev\.benz\.walker
# arch-askpass theme sets title="arch-askpass" so we can size it tighter
windowrule = size 600 240,    match:title arch-askpass

# Steam games auto-fullscreen so they draw above the floating Steam client window
windowrule = fullscreen 1, match:class steam_app_.*

# Keep the Steam client window on its own workspace so it never sits over a game
windowrule = workspace 9 silent, match:class steam, match:title Steam
