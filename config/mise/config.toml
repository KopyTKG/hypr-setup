# Global mise config — all dev tooling is managed here.
# https://mise.jdx.dev/configuration.html
#
# Apply changes:   mise install
# Inspect:         mise list
# Run a tool:      mise exec <tool> -- <cmd>     (or just `mise x -- <cmd>`)
#
# Per-project overrides go in <project>/mise.toml or .tool-versions.

[tools]
node    = "lts"
python  = "3.13"
go      = "latest"
rust    = "stable"
# Uncomment what you actually need:
# ruby    = "3.3"
# bun     = "latest"
# deno    = "latest"
# java    = "21"
# pnpm    = "latest"
# yarn    = "latest"
# uv      = "latest"
# poetry  = "latest"
# terraform = "latest"
# kubectl = "latest"

[settings]
# Auto-activate tools when entering a directory
experimental = true
# Don't ask for confirmation on every new mise.toml in a repo you cd into
trusted_config_paths = ["~"]
