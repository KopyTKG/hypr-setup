# Variables
$terminal = uwsm app -- xdg-terminal-exec
$browser  = chromium

# Cleanup conflicting upstream defaults so our binds win
unbind = SUPER, T
unbind = SUPER, B
unbind = SUPER, F
unbind = SUPER, N
unbind = SUPER, M
unbind = SUPER, D
unbind = SUPER, A
unbind = SUPER, C
unbind = SUPER, E
unbind = SUPER, I
unbind = SUPER, F11
unbind = SUPER, SPACE
unbind = SUPER ALT, SPACE
unbind = SUPER ALT, RETURN
unbind = SUPER SHIFT, B
unbind = SUPER SHIFT, D
unbind = SUPER SHIFT, A
unbind = SUPER SHIFT, I
unbind = SUPER CTRL, A
unbind = SUPER CTRL, I

# Window management
bindd = SUPER, F11, Fullscreen, fullscreen, 0

# Default apps
bindd = SUPER, T, Terminal, exec, $terminal
bindd = SUPER ALT, RETURN, Tmux, exec, $terminal -- tmux new
bindd = SUPER, B, Browser, exec, $browser
bindd = SUPER SHIFT, B, Browser (private), exec, $browser --incognito
bindd = SUPER, F, File manager, exec, uwsm app -- nautilus --new-window
bindd = SUPER, N, Editor, exec, $terminal -- nvim
bindd = SUPER, M, Music, exec, launch-or-focus Spotify spotify
bindd = SUPER, D, Discord, exec, launch-or-focus discord discord-canary
bindd = SUPER SHIFT, D, Docker, exec, $terminal -- lazydocker

# Start menu — app launcher (also lists all PWAs from webapps.list)
bindd = SUPER ALT, SPACE, Start menu, exec, walker

# Webapps — Proton
bindd = SUPER, C, Calendar, exec, launch-webapp "Proton Calendar" "https://calendar.proton.me/u/0/"
bindd = SUPER, E, Email,    exec, launch-webapp "Proton Mail"     "https://mail.proton.me/u/0/inbox"

# Webapps — AI
bindd = SUPER, A,        Claude, exec, launch-webapp Claude "https://claude.ai/"
bindd = SUPER SHIFT, A,  V0,     exec, launch-webapp V0     "https://v0.app/"
bindd = SUPER CTRL, A,   Gemini, exec, launch-webapp Gemini "https://gemini.google.com/app"

# Webapps — Communication
bindd = SUPER, I,        Instagram, exec, launch-webapp Instagram "https://www.instagram.com/"
bindd = SUPER SHIFT, I,  WhatsApp,  exec, launch-webapp WhatsApp  "https://web.whatsapp.com/"
bindd = SUPER CTRL, I,   Messenger, exec, launch-webapp Messenger "https://www.messenger.com/"
