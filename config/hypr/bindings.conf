# Application bindings
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" tmux new
$terminal = uwsm app -- $TERMINAL
$browser = omarchy-launch-browser


# Cleanup
unbind = SUPER, T
unbind = SUPER, B
unbind = SUPER, F
unbind = SUPER CTRL, A
unbind = SUPER, F11

# Rebind fullscreen toggle
bindd = SUPER, F11, Fullscreen, fullscreen, 0

# Default
bindd = SUPER, T, Terminal, exec, $terminal --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER, B, Browser, exec, $browser
bindd = SUPER SHIFT, B, Browser (private), exec, $browser --private
bindd = SUPER, F, File manager, exec, uwsm app -- nautilus --new-window

# ?? 
bindd = SUPER, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER, D, Discord, exec, discord-canary

# Proton stuff
bindd = SUPER, C, Calendar, exec, omarchy-launch-or-focus-webapp Calendar "https://calendar.proton.me/u/0/"
bindd = SUPER, E, Email, exec, omarchy-launch-or-focus-webapp Email "https://mail.proton.me/u/0/inbox"

# AI stuff
bindd = SUPER , A, Claude, exec, omarchy-launch-webapp "https://claude.ai/"
bindd = SUPER SHIFT, A, V0, exec, omarchy-launch-webapp "https://v0.app/"
bindd = SUPER CTRL, A, Gemini, exec, omarchy-launch-webapp "https://gemini.google.com/app?hl=cs"

# Coms
bindd = SUPER, I, Instagram, exec, omarchy-launch-or-focus-webapp Instagram "https://www.instagram.com/"
bindd = SUPER SHIFT, I, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER CTRL, I, Messenger, exec, omarchy-launch-or-focus-webapp Messenger "https://www.messenger.com/e2ee/t/28395601576750106/"

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER SHIFT, SPACE
# bindd = SUPER SHIFT, SPACE, Omarchy menu, exec, omarchy-menu
